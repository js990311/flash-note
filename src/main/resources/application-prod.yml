server:
  tomcat:
    max-http-form-post-size: 30MB
  forward-headers-strategy: framework


spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: flashnote
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
  datasource:
    url: jdbc:mariadb://${DATASOURCE_HOST}/${DATASOURCE_DB_NAME}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    locations:
      - classpath:db/migration/prod

jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: false
    query:
      enable-logging: true
      log-level: DEBUG
      logger-name: net.ttddyy.dsproxy.listener
    slow-query:
      enable-logging: true
      threshold: 300
      log-level: WARN
      logger-name: net.ttddyy.dsproxy.listener.SlowQueryListener
    logging: slf4j
    multiline: false
    json-format: false

logging:
  level:
    root: INFO
    com.rejs.flashnote: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    net.ttddyy.dsproxy.listener: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# 프로메테우스. actuator를 전부 오픈
management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://note-alloy:4318/v1/traces
      timeout: 10s

gemini:
  api:
    key: ${GEMINI_API_KEY}

meilisearch:
  api-key: ${MEILISEARCH_API_KEY}
  host: ${MEILISEARCH_HOST}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS}
    secret-key: ${AWS_S3_SECRET}
    bucket: ${AWS_S3_BUCKET}
