server:
  tomcat:
    max-http-form-post-size: 30MB


spring:
  application:
    name: flashnote
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
  datasource:
    url: jdbc:mariadb://${DATASOURCE_HOST}/${DATASOURCE_DB_NAME}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    locations:
      - classpath:db/migration/prod
logging:
  level:
    root: INFO
    com.rejs.flashnote: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# 프로메테우스. actuator를 전부 오픈
management:
  endpoints:
    web:
      exposure:
        include: "*"
gemini:
  api:
    key: ${GEMINI_API_KEY}