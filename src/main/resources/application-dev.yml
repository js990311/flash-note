server:
  jsp-servlet:
    init-parameters:
      development: true
  tomcat:
    max-http-form-post-size: 30MB

spring:
  application:
    name: flashnote
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
  datasource:
    url: jdbc:mariadb://${DATASOURCE_HOST}/${DATASOURCE_DB_NAME}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    locations:
      - classpath:db/migration/dev
jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: true
    query:
      enable-logging: true
      log-level: DEBUG
      logger-name: net.ttddyy.dsproxy.listener
    slow-query:
      enable-logging: true
      threshold: 300
      log-level: WARN
      logger-name: net.ttddyy.dsproxy.listener.SlowQueryListener
    logging: slf4j
    multiline: true
    json-format: false


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.web: DEBUG

gemini:
  api:
    key: ${GEMINI_API_KEY}

meilisearch:
  api-key: ${MEILISEARCH_API_KEY}
  host: ${MEILISEARCH_HOST}